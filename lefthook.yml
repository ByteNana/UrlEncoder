# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Local overrides: create .lefthook-local.yml (gitignored)

commit-msg:
  commands:
    convco:
      run: convco check --from-stdin < {1}

pre-commit:
  commands:
    format-check:
      glob: "*.{c,cpp,h,hpp}"
      run: make check
    lint:
      glob: "src/*.{c,cpp,h,hpp}"
      run: make lint

pre-push:
  scripts:
    "branch-protection.sh":
      use_stdin: true
      runner: bash
    "version-validation.sh":
      runner: bash
