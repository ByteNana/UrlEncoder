name: Setup environment
description: Installs CMake and build dependencies

inputs:
  cmake-version:
    description: CMake version to install
    default: '3.31.6'

runs:
  using: composite
  steps:
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: ${{ inputs.cmake-version }}

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make pkg-config libssl-dev
