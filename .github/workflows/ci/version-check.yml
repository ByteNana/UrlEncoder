name: Version Check

on:
  pull_request:
    branches: [master]

jobs:
  check-tag-available:
    name: Check version tag is available
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from library.json
        id: version
        run: |
          RAW=$(jq -r '.version' library.json)
          if [ -z "$RAW" ]; then
            echo "::error::Could not extract version from library.json"
            exit 1
          fi
          # Strip pre-release suffix to get the release tag that will be created
          VERSION="${RAW%%-*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Raw version: ${RAW} → release tag: v${VERSION}"

      - name: Verify tag does not exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Bump the version in CMakeLists.txt before merging."
            exit 1
          fi
          echo "Tag ${TAG} is available."
