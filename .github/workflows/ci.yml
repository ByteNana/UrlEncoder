name: CI Passed

on:
  workflow_run:
    workflows: ["Orchestrator"]
    types: [completed]

jobs:
  check:
    name: CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Reflect orchestrator result
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "Orchestrator did not pass: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi
