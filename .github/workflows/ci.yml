name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ['rc-*', master]

jobs:
  test:
    name: Build + Tests + Example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make pkg-config libssl-dev

      - name: Install PlatformIO
        run: pip install platformio --break-system-packages

      - name: Build + Test
        run: make test

      - name: Example (pio ci)
        run: make examples
